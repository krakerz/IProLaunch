[defaults]
proton = "system"
prefix_mode = "single"
prefix_path = "~/.local/share/iprolaunch/prefix"
prefixes_root = "~/.local/share/iprolaunch/prefixes"
windows-version = "win10"
winearch = "win64"
gamescope = "none"

[logging]
mode = "single"
path = ""
keep = 3
record = "errors"
auto_open = true

[gamedb]
update_interval_days = 7

[env]

[winedlloverride]

[sunshine]
# Run Sunshine games in fullscreen gamescope with the game's window stretched to fill it (a profile can turn this off)
gamescope = true
# Resolution mode: "match-client" (default) or "fixed"
resolution_mode = "match-client"
# Fixed resolution dimensions (used in fixed mode and as fallback)
width = 1920
height = 1080
refresh = 60
# Upper bound on client refresh (unset by default)
# refresh_cap = 120
# Display scaling factor
scale = 1.0
# PulseAudio/PipeWire sink name for Sunshine's audio
audio_sink = "iprolaunch-stream"
# Audio channels: "match-client" (default), "stereo", "5.1", "7.1"
audio_channels = "match-client"
# Keep streamed input devices off the host desktop
input_isolation = true
# Exact libvirtualhid-* device names to isolate (empty = auto-detect)
input_match = []
# Stream cursor: "auto" (hide after 3s without mouse movement, e.g. with a controller), "hidden", or "visible"
cursor = "auto"
# Socket name for Sunshine vdesktop communication
socket_name = "iprolaunch-sunshine.sock"
# Keep the host PC's own audio output while a stream runs
keep_host_audio = true

[steamgriddb]
# SteamGridDB API key for fetching game covers; request one at https://www.steamgriddb.com/profile/preferences/api
# api_key = "..."
