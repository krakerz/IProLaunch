[package]
name = "iprolaunch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "iprolaunch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
ratatui = "0.29"
crossterm = "0.28"
