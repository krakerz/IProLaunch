[package]
name = "iprolaunch"
version = "1.29.0"
edition = "2024"
license = "GPL-3.0-or-later"

[[bin]]
name = "iprolaunch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
directories = "5"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset"] }
signal-hook = "0.3"
ratatui = "0.29"
crossterm = "0.28"
ureq = "3.4.0"
csv = "1.4.0"
gilrs = "0.11.2"
